<div class="sale-tabs-wrap">
  <div class="sale-tabs-bar">
    <div class="tabs-scroll">
      @for (tab of tabs; track tab.id) {
        <button
          class="tab-button"
          [class.active]="tab.id === activeTabId"
          (click)="onTabSelect(tab.id)"
        >
          <span class="tab-total">{{ tab.total | appCurrency:'1.0-0' }}</span>
          @if (tab.itemCount > 0) {
            <span class="tab-badge">{{ tab.itemCount }}</span>
          }
          <ion-button
            fill="clear"
            size="small"
            class="tab-close"
            (click)="onTabClose(tab.id, $event)"
          >
            <ion-icon name="close-outline" slot="icon-only"></ion-icon>
          </ion-button>
        </button>
      }
    </div>
  </div>

  <ion-button
    size="small"
    fill="solid"
    class="new-tab-btn"
    [disabled]="disableNewTab"
    (click)="newTab.emit()"
    [attr.title]="('POS.NEW_SALE' | translate) + ' (F1)'"
  >
    <ion-icon name="add-outline" slot="start"></ion-icon>
    <span class="new-tab-label">{{ 'POS.NEW_SALE' | translate }}</span>
  </ion-button>
</div>
